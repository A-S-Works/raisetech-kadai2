<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RAISE HOME</title>
  <meta name="description" content="ページの説明文">

  <!-- favicon -->
  <link rel="icon" href="/favicon.ico">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Gruppo&display=swap" rel="stylesheet">

  <!-- reset CSS -->
  <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">

  <!-- main CSS -->
  <link rel="stylesheet" href="/css/style.css">

  <!-- font awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
  <header>
    <div class="header">
      <a href="/index.html"><img class="header__logo" src="/images/Logo.svg" alt="RAISE HOME" width="255" height="28"></a>
      <button class="header__menu" aria-label="メニュー">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="main-nav" aria-label="ヘッダーナビゲーション">
        <ul class="main-nav__list">
          <li class="main-nav__item"><a href="/company.html">会社概要</a></li>
          <li class="main-nav__item"><a href="/access.html">アクセス</a></li>
          <li class="main-nav__item main-nav__item--contact"><a href="/contact.html">お問い合わせ</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main contact-page">
    <div class="main-visual">
        <div class="main-visual__image"><img src="/images/Contact_Main.jpg" alt="メインビジュアル" width="2880" height="744"></div>
        <div class="main-visual__image-tb"><img src="/images/Contact_Main_tb.jpg" alt="メインビジュアル" width="1668" height="744"></div>
        <div class="main-visual__contents">
        <h1 class="main-visual__title">お問い合わせ</h1>
      </div>
    </div>

    <section class="section">
      <div class="container">
        <div class="contact-page__body">
            <h3 class="contact-page__title">お問い合わせ・ご相談は<br>こちらのフォームから</h3>
            <form class="contact-page__form">
                <div class="contact-page__form-item">
                    <label for="name">お名前<span class="contact-page__required">必須</span></label>
                    <input type="text" id="name" name="name" placeholder="例）山田 太郎" required>
                </div>
                <div class="contact-page__form-item">
                    <label for="name">企業名</label>
                    <input type="text" id="company" name="company" placeholder="例）株式会社RAISEHOME" required>
                </div>
                <div class="contact-page__form-item">
                    <label for="name">メールアドレス<span class="contact-page__required">必須</span></label>
                    <input type="email" id="email" name="email" placeholder="例）example@mail.com" required>
                </div>
                <div class="contact-page__form-item">
                    <p class="contact-page__form-label">お問い合わせ種別（選択してください）<span class="contact-page__required">必須</span></p>
                    <div class="contact-page__form-radio">
                        <label>
                            <input type="radio" name="type" value="ご質問" required>
                            ご質問
                        </label>
                        <label>
                            <input type="radio" name="type" value="ご要望">
                            ご要望
                        </label>
                        <label>
                            <input type="radio" name="type" value="お見積もり">
                            お見積もり
                        </label>
                        <label>
                            <input type="radio" name="type" value="その他">
                            その他
                        </label>
                    </div>
                </div>
                <div class="contact-page__form-item">
                    <label for="message">お問い合わせ内容<span class="contact-page__required">必須</span></label>
                    <textarea id="message" name="message" placeholder="内容を入力してください。" required></textarea>
                </div>
                <div class="contact-page__form-item contact-page__form-agreement">
                    <label>
                        <input type="checkbox" name="agreement" value="同意する" required>
                        利用規約、プライバシーポリシーに同意する
                    </label>
                </div>
                <button type="submit" class="contact-page__form-submit">
                    送信する
                    <span class="contact-page__form-submit-arrow"></span>
                </button>
            </form>
        </div>
      </div>
    </section>

  <footer class="footer">
      <div class="footer__inner">
        <a href="/index.html"><img class="footer__logo" src="/images/Logo.svg" alt="RAISE HOME" width="255" height="28"></a>
        <div class="footer__menu">
          <nav class="footer-nav">
            <ul class="footer-nav__list">
              <li class="footer-nav__item"><a href="/company.html">会社紹介</a></li>
              <li class="footer-nav__item"><a href="/access.html">アクセス</a></li>
              <li class="footer-nav__item"><a href="/contact.html">お問い合わせ</a></li>
            </ul>
          </nav>
          <nav class="footer-sns">
            <ul class="footer-sns__list">
              <li class="footer-sns__item"><a href="" aria-label="X-Twitter"><i class="fa-brands fa-x-twitter"></i></a></li>
              <li class="footer-sns__item"><a href="" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a></li>
              <li class="footer-sns__item"><a href="" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a></li>
            </ul>
          </nav>
        </div>
      </div>
      <p class="copyright">&copy;2023RAISE HOME</p>
  </footer>
</body>
</html>
